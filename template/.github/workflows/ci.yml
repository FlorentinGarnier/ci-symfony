# Chaque demande de fusion : contrôles et construction des images.
# Chaque fusion sur main : contrôles (sauf si la PR a déjà tout passé sur le même arbre), images publiées par digest,
# déploiement automatique sur staging.
# Seul fichier où se trouvent les réglages propres au projet (voir FlorentinGarnier/ci-symfony).
name: CI

on:
    pull_request: ~
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    tested:
        if: github.event_name == 'push'
        uses: FlorentinGarnier/ci-symfony/.github/workflows/tested-tree.yml@v1
        permissions:
            actions: read
            contents: read

    checks:
        needs: tested
        if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' }}
        uses: FlorentinGarnier/ci-symfony/.github/workflows/ci.yml@v1
        with:
            php-version: "8.4"
            database: postgres

    # needs doit lister tous les contrôles : le marqueur d'arbre testé n'est écrit qu'après eux.
    images:
        needs: [tested, checks]
        if: ${{ !cancelled() && (needs.tested.outputs.tested == 'true' || needs.checks.result == 'success') }}
        uses: FlorentinGarnier/ci-symfony/.github/workflows/build.yml@v1
        permissions:
            contents: read
            packages: write
        with:
            mark-tested-tree: true

    staging:
        if: ${{ !cancelled() && github.event_name == 'push' && needs.images.result == 'success' }}
        needs: images
        uses: FlorentinGarnier/ci-symfony/.github/workflows/deploy.yml@v1
        with:
            environment: staging
            php_image: ${{ needs.images.outputs.php_image }}
            web_image: ${{ needs.images.outputs.web_image }}
            commit: ${{ github.sha }}
        secrets:
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
            DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
            BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
