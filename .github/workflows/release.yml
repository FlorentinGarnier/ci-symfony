# Prépare la mise en production d'une GitHub Release publiée (ou d'une release existante, pour un retour arrière) :
#   1. retrouve le commit de l'étiquette et l'exécution réussie de la CI sur la branche principale pour ce commit
#      (staging déployé et contrôlé compris) ;
#   2. lit son manifeste : les images exactes, par digest, déjà recettées en staging ;
#   3. les analyse avec Trivy (faille critique corrigeable = blocage).
# Le déploiement est enchaîné par le workflow appelant (deploy.yml). Le serveur refuse de son côté
# toute paire d'images qui n'a pas été validée en staging ou déjà servie en production.
name: Release

on:
    workflow_call:
        inputs:
            release-tag:
                description: Étiquette de la release (par défaut celle de l'évènement release)
                type: string
                default: ""
            ci-workflow:
                description: Fichier du workflow qui construit les images et déploie staging
                type: string
                default: ci.yml
            main-branch:
                type: string
                default: main
        outputs:
            php_image:
                value: ${{ jobs.resolve.outputs.php_image }}
            web_image:
                value: ${{ jobs.resolve.outputs.web_image }}
            commit:
                value: ${{ jobs.resolve.outputs.commit }}

permissions:
    actions: read
    contents: read
    packages: read

jobs:
    resolve:
        name: Images recettées de la release
        runs-on: ubuntu-latest
        outputs:
            php_image: ${{ steps.manifest.outputs.php_image }}
            web_image: ${{ steps.manifest.outputs.web_image }}
            commit: ${{ steps.source.outputs.commit }}
        env:
            GH_TOKEN: ${{ github.token }}
            RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        steps:
            -   name: Release publiée et commit de l'étiquette
                id: source
                run: |
                    set -euo pipefail
                    [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Étiquette invalide : « $RELEASE_TAG »."; exit 1; }
                    [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" == false ]] \
                        || { echo "::error::$RELEASE_TAG n'est pas une release publiée."; exit 1; }
                    ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
                    object_type=$(jq -r .object.type <<<"$ref")
                    object_sha=$(jq -r .object.sha <<<"$ref")
                    if [[ "$object_type" == tag ]]; then
                        object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq .object.sha)
                    fi
                    [[ "$object_sha" =~ ^[a-f0-9]{40}$ ]]
                    echo "commit=$object_sha" >> "$GITHUB_OUTPUT"

            -   name: Exécution réussie de la CI pour ce commit
                id: run
                env:
                    COMMIT: ${{ steps.source.outputs.commit }}
                    CI_WORKFLOW: ${{ inputs.ci-workflow }}
                    MAIN: ${{ inputs.main-branch }}
                run: |
                    set -euo pipefail
                    run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs?head_sha=$COMMIT&event=push&status=success&per_page=20" \
                        --jq "[.workflow_runs[] | select(.head_branch == \"$MAIN\")][0].id // empty")
                    [[ "$run_id" =~ ^[0-9]+$ ]] \
                        || { echo "::error::Aucune exécution réussie de $CI_WORKFLOW sur $MAIN pour $COMMIT : ce commit n'a pas été recetté en staging."; exit 1; }
                    echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

            -   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
                with:
                    name: release-manifest-${{ steps.run.outputs.run_id }}
                    path: release
                    repository: ${{ github.repository }}
                    run-id: ${{ steps.run.outputs.run_id }}
                    github-token: ${{ github.token }}

            -   name: Vérification du manifeste
                id: manifest
                env:
                    RUN_ID: ${{ steps.run.outputs.run_id }}
                    COMMIT: ${{ steps.source.outputs.commit }}
                run: |
                    set -euo pipefail
                    manifest=release/release-manifest.json
                    [[ "$(jq -r .schema "$manifest")" == 1 ]]
                    [[ "$(jq -r .repository "$manifest")" == "$GITHUB_REPOSITORY" ]]
                    [[ "$(jq -r .run_id "$manifest")" == "$RUN_ID" ]]
                    [[ "$(jq -r .commit "$manifest")" == "$COMMIT" ]]
                    php_image=$(jq -r .php_image "$manifest")
                    web_image=$(jq -r .web_image "$manifest")
                    [[ "$php_image" =~ ^ghcr\.io/[a-z0-9_./-]+-php@sha256:[a-f0-9]{64}$ ]]
                    [[ "$web_image" =~ ^ghcr\.io/[a-z0-9_./-]+-web@sha256:[a-f0-9]{64}$ ]]
                    printf 'php_image=%s\nweb_image=%s\n' "$php_image" "$web_image" >> "$GITHUB_OUTPUT"

    scan:
        name: Analyse de l'image ${{ matrix.image }}
        needs: resolve
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                image: [php, web]
        steps:
            -   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
                with:
                    image-ref: ${{ matrix.image == 'php' && needs.resolve.outputs.php_image || needs.resolve.outputs.web_image }}
                    severity: CRITICAL
                    ignore-unfixed: true
                    exit-code: "1"
                env:
                    TRIVY_USERNAME: ${{ github.actor }}
                    TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
