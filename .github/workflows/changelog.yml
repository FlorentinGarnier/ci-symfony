# Rédige les notes d'une release publiée à partir de la dernière release stable, et les joint en CHANGELOG-<tag>.md.
name: Changelog

on:
    workflow_call:
        inputs:
            release-tag:
                description: Étiquette de la release (par défaut celle de l'évènement release)
                type: string
                default: ""

permissions:
    contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Generate notes from the previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ inputs.release-tag == '' && github.event.release.id || '' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]

          releases=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100")
          previous_tag=$(jq -r --arg current "$RELEASE_TAG" '
            [.[] | select(.draft == false and .prerelease == false and .tag_name != $current)]
            | sort_by(.published_at) | reverse | .[0].tag_name // empty
          ' <<<"$releases")

          if [ -n "$previous_tag" ]; then
            payload=$(jq -n --arg tag "$RELEASE_TAG" --arg previous "$previous_tag" \
              '{tag_name: $tag, previous_tag_name: $previous}')
          else
            payload=$(jq -n --arg tag "$RELEASE_TAG" '{tag_name: $tag}')
          fi

          if [ -n "$previous_tag" ]; then
            generated=$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/generate-notes")
            body=$(jq -r .body <<<"$generated")
            name=$(jq -r .name <<<"$generated")
            header="## $name\n\nChangelog depuis la release stable [$previous_tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$previous_tag)."
          else
            name="$RELEASE_TAG"
            # shellcheck disable=SC2016 # accents graves littéraux (Markdown)
            body=$(git log --no-merges --pretty=format:'- %s (`%h`)' "$RELEASE_TAG")
            header="## $name\n\nChangelog initial de cette release."
          fi
          full_body=$(printf '%b\n\n%s\n\n<!-- Généré automatiquement depuis la dernière release stable. -->\n' "$header" "$body")

          if [ -z "$RELEASE_ID" ]; then
            release=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            RELEASE_ID=$(jq -r .id <<<"$release")
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]

          jq -n --arg body "$full_body" '{body: $body}' | \
            curl --fail-with-body -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              -d @- \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >/dev/null

          notes_file="CHANGELOG-${RELEASE_TAG}.md"
          printf '%b\n\n%s\n' "$header" "$body" > "$notes_file"
          gh release upload "$RELEASE_TAG" "$notes_file" --clobber --repo "$GITHUB_REPOSITORY"
