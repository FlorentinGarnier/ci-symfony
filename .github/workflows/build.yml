# Construit les images php et web (cibles du Dockerfile) à chaque exécution, pour vérifier le Dockerfile.
# Sur la branche principale seulement, les publie sur GHCR et écrit le manifeste de version :
# les références par digest (…@sha256:…) qu'utilisent staging puis la production.
#
#   ghcr.io/<propriétaire>/<dépôt>-php@sha256:…   PHP-FPM, sert aussi aux workers
#   ghcr.io/<propriétaire>/<dépôt>-web@sha256:…   Nginx + fichiers publics + page de maintenance
name: Images

on:
    workflow_call:
        inputs:
            dockerfile:
                type: string
                default: Dockerfile
            main-branch:
                type: string
                default: main
        outputs:
            php_image:
                description: Référence par digest de l'image php (vide hors branche principale)
                value: ${{ jobs.images.outputs.php_image }}
            web_image:
                description: Référence par digest de l'image web (vide hors branche principale)
                value: ${{ jobs.images.outputs.web_image }}

permissions:
    contents: read
    packages: write

jobs:
    images:
        name: Images
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            php_image: ${{ steps.refs.outputs.php_image }}
            web_image: ${{ steps.refs.outputs.web_image }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   id: meta
                env:
                    PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.main-branch) }}
                run: |
                    {
                        echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}"
                        echo "version=sha-${GITHUB_SHA::12}"
                        echo "publish=$PUBLISH"
                    } >> "$GITHUB_OUTPUT"

            # Images de Docker Hub via mirror.gcr.io (miroir de Google) : les runners partagent leurs IP et Docker Hub
            # limite les téléchargements anonymes. Concerne BuildKit lui-même et les images de base des Dockerfile,
            # qui restent inchangés.
            -   uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
                with:
                    driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
                    buildkitd-config-inline: |
                        [registry."docker.io"]
                          mirrors = ["mirror.gcr.io"]

            -   if: steps.meta.outputs.publish == 'true'
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Image php
                id: php
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: .
                    file: ${{ inputs.dockerfile }}
                    target: php
                    push: ${{ steps.meta.outputs.publish == 'true' }}
                    tags: ${{ steps.meta.outputs.prefix }}-php:${{ github.sha }}
                    labels: |
                        org.opencontainers.image.source=https://github.com/${{ github.repository }}
                        org.opencontainers.image.revision=${{ github.sha }}
                    build-args: |
                        APP_VERSION=${{ steps.meta.outputs.version }}
                        APP_COMMIT=${{ github.sha }}
                    cache-from: type=gha
                    cache-to: type=gha,mode=max

            -   name: Image web
                id: web
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: .
                    file: ${{ inputs.dockerfile }}
                    target: web
                    push: ${{ steps.meta.outputs.publish == 'true' }}
                    tags: ${{ steps.meta.outputs.prefix }}-web:${{ github.sha }}
                    labels: |
                        org.opencontainers.image.source=https://github.com/${{ github.repository }}
                        org.opencontainers.image.revision=${{ github.sha }}
                    build-args: |
                        APP_VERSION=${{ steps.meta.outputs.version }}
                        APP_COMMIT=${{ github.sha }}
                    cache-from: type=gha

            -   name: Références par digest
                id: refs
                if: steps.meta.outputs.publish == 'true'
                env:
                    PREFIX: ${{ steps.meta.outputs.prefix }}
                    PHP_DIGEST: ${{ steps.php.outputs.digest }}
                    WEB_DIGEST: ${{ steps.web.outputs.digest }}
                run: |
                    [[ "$PHP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
                    echo "php_image=$PREFIX-php@$PHP_DIGEST" >> "$GITHUB_OUTPUT"
                    echo "web_image=$PREFIX-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"

            # Manifeste immuable : la production retrouve ici les images exactes construites pour un commit.
            -   name: Manifeste de version
                if: steps.meta.outputs.publish == 'true'
                env:
                    PHP_IMAGE: ${{ steps.refs.outputs.php_image }}
                    WEB_IMAGE: ${{ steps.refs.outputs.web_image }}
                run: |
                    jq -n \
                        --arg repository "$GITHUB_REPOSITORY" \
                        --arg commit "$GITHUB_SHA" \
                        --arg php_image "$PHP_IMAGE" \
                        --arg web_image "$WEB_IMAGE" \
                        --arg run_id "$GITHUB_RUN_ID" \
                        '{schema: 1, repository: $repository, commit: $commit, run_id: ($run_id|tonumber), php_image: $php_image, web_image: $web_image}' \
                        > release-manifest.json

            -   if: steps.meta.outputs.publish == 'true'
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: release-manifest-${{ github.run_id }}
                    path: release-manifest.json
                    if-no-files-found: error
                    retention-days: 90
